<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0d17"/>
      <stop offset="0.55" stop-color="#1a1430"/>
      <stop offset="1" stop-color="#231a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#c9bcff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="105" x2="1600" y2="105"/>
    <line x1="0" y1="210" x2="1600" y2="210"/>
    <line x1="0" y1="315" x2="1600" y2="315"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1200" y1="0" x2="1200" y2="420"/>
  </g>

  <!-- logo tile -->
  <rect x="110" y="118" width="92" height="92" rx="24" fill="url(#accent)"/>
  <g>
    <rect x="134" y="152" width="10" height="30" rx="5" fill="#ffffff"/>
    <rect x="152" y="138" width="10" height="52" rx="5" fill="#ffffff"/>
    <rect x="170" y="146" width="10" height="42" rx="5" fill="#ffffff"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="230" y="176" font-family="DejaVu Sans, sans-serif" font-size="82" font-weight="bold" fill="#ffffff">Harmonia</text>
  <text x="232" y="222" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#b9b0d8">The fast, beautiful, open-source music player</text>
  <text x="232" y="258" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#b9b0d8">for Linux · Windows · Android</text>

  <!-- platform chips -->
  <g font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">
    <rect x="232" y="286" width="116" height="44" rx="22" fill="#7c5cff"/>
    <text x="290" y="314" text-anchor="middle">Linux</text>
    <rect x="362" y="286" width="140" height="44" rx="22" fill="#7c5cff"/>
    <text x="432" y="314" text-anchor="middle">Windows</text>
    <rect x="516" y="286" width="128" height="44" rx="22" fill="#7c5cff"/>
    <text x="580" y="314" text-anchor="middle">Android</text>
  </g>

  <!-- equalizer bars -->
  <g>
    <rect x="1216" y="178" width="28" height="64" rx="8" fill="url(#bar)" opacity="0.85"/>
    <rect x="1260" y="130" width="28" height="160" rx="8" fill="url(#bar)"/>
    <rect x="1304" y="152" width="28" height="116" rx="8" fill="url(#bar)" opacity="0.9"/>
    <rect x="1348" y="108" width="28" height="204" rx="8" fill="url(#bar)"/>
    <rect x="1392" y="166" width="28" height="88" rx="8" fill="url(#bar)" opacity="0.75"/>
  </g>

  <text x="1216" y="360" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8d83b0">open source · MIT</text>
</svg>

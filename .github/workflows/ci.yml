name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: harmonia-core (tests, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p harmonia-core --check

      - name: Lint
        run: cargo clippy -p harmonia-core -- -D warnings

      - name: Test
        run: cargo test -p harmonia-core

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  package:
    name: Package (AppImage + deb)
    # Linux packages need the Tauri system dependencies; Ubuntu 22.04 is the
    # lowest officially supported base for the bundled WebKit runtime.
    runs-on: ubuntu-22.04
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build bundles
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-bundles
          # Cargo workspace root is the repo root, so bundles land in
          # target/ (not src-tauri/target/).
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/harmonia
          if-no-files-found: error

  package-windows:
    name: Package (NSIS installer + portable exe)
    runs-on: windows-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows bundles (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-windows-bundles
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/harmonia.exe
          if-no-files-found: error

  package-android:
    name: Package (Android APK)
    runs-on: ubuntu-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # ubuntu-latest ships the Android SDK; make sure the NDK version the
      # Tauri toolchain expects is present.
      - name: Ensure Android NDK
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
          fi

      - name: Build Android APK
        env:
          # Skips the Linux desktop system-dependency preflight — mobile
          # builds need none of WebKitGTK/ALSA (the NDK supplies the
          # toolchain). The frontend still builds normally.
          HARMONIA_BUILD_ANDROID: "1"
        # arm64 only: this job guards the mobile build on every push without
        # paying for four ABI compilations (releases build aarch64 + x86_64).
        run: npm run tauri -- android build --apk --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

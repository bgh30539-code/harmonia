name: Release

# Build production bundles on version tags and publish them to a GitHub
# release with Linux (.deb, AppImage) and Windows (.exe installer, portable
# executable) artifacts.
on:
  push:
    tags:
      - "v*"

permissions:
  # Required to create the release and upload bundle assets.
  contents: write

env:
  CARGO_TERM_COLOR: always

# A re-pushed/force-pushed tag should cancel any in-flight run for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (tests, clippy, fmt, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p harmonia-core --check

      - name: Lint
        run: cargo clippy -p harmonia-core -- -D warnings

      - name: Test
        run: cargo test -p harmonia-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  release:
    name: Build Linux bundles & publish release
    runs-on: ubuntu-22.04
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install npm dependencies
        run: npm ci

      # Fail fast if the tag doesn't match the packaged version, so a release
      # never ships bundles stamped with the wrong version number.
      - name: Verify tag matches package version
        run: |
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag 'v${TAG_VERSION}' does not match version '${CONF_VERSION}' in src-tauri/tauri.conf.json. Bump the version before tagging."
            exit 1
          fi

      - name: Build bundles (AppImage + deb)
        run: npm run tauri build -- --bundles appimage,deb

      # Extract this version's section from the Keep-a-Changelog file; fall
      # back to a pointer if the section is missing or empty.
      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Capture the "## [x.y.z]" section up to the next "## [" header
          # (awk string "\\[" compiles to a literal-bracket regex).
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { section = 1; next }
            section && $0 ~ "^## \\[" { section = 0 }
            section && NF { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See the [CHANGELOG](CHANGELOG.md) for a summary of changes in this release." > release-notes.md
          fi

      # Append installation + verification sections so every release page
      # carries the full picture, not just the changelog.
      - name: Append installation instructions to release notes
        run: |
          cat >> release-notes.md <<'EOF'

          ---

          ## Installation

          - **Linux**: `sudo apt install ./Harmonia_*.deb`, or run the AppImage (`chmod +x Harmonia-*.AppImage`)
          - **Windows**: run `Harmonia-*_setup.exe`, or the portable `harmonia.exe`
          - **Android**: side-load `app-universal-release.apk` (Android 8.0+ / API 26)

          See [docs/INSTALL.md](https://github.com/bgh30539-code/harmonia/blob/main/docs/INSTALL.md) for details.

          ## Verify downloads

          SHA-256 checksums for every artifact are published alongside this release as `SHA256SUMS-*` files. Verify with:

          ```bash
          sha256sum -c SHA256SUMS-linux.txt
          ```

          ## Supported platforms

          | Platform | Artifacts |
          | --- | --- |
          | Linux | .deb, AppImage, raw binary |
          | Windows | NSIS installer, portable exe |
          | Android | Universal APK, AAB |
          EOF

      - name: Generate Linux checksums
        run: |
          sha256sum target/release/bundle/appimage/*.AppImage \
                    target/release/bundle/deb/*.deb \
                    target/release/harmonia > SHA256SUMS-linux.txt

      # Create the release as a DRAFT. The Windows job (which runs after this
      # one) uploads the .exe artifacts and flips it to published — so the
      # release only ever becomes visible with the complete artifact set.
      - name: Create draft release (Linux artifacts)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Harmonia ${{ github.ref_name }}"
          body_path: release-notes.md
          # Cargo workspace root is the repo root, so bundles land in
          # target/ (not src-tauri/target/).
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/harmonia
            SHA256SUMS-linux.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    # Runs after the Linux job so the draft release exists before its assets
    # are appended (softprops updates the existing release for this tag).
    needs: [verify, release]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # ubuntu-latest ships the Android SDK; make sure the NDK version the
      # Tauri toolchain expects is present.
      - name: Ensure Android NDK
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125"
          fi

      - name: Verify tag matches package version
        run: |
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag 'v${TAG_VERSION}' does not match version '${CONF_VERSION}' in src-tauri/tauri.conf.json. Bump the version before tagging."
            exit 1
          fi

      - name: Build Android APK + AAB
        env:
          # Skips the Linux desktop system-dependency preflight — mobile
          # builds need none of WebKitGTK/ALSA (the NDK supplies the
          # toolchain). The frontend still builds normally.
          HARMONIA_BUILD_ANDROID: "1"
        # aarch64 (real devices) + x86_64 (emulators); building all four ABIs
        # with LTO would blow past the job timeout on a cold cache.
        run: npm run tauri -- android build --apk --aab --target aarch64 x86_64

      - name: Generate Android checksums
        run: |
          sha256sum src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
                    src-tauri/gen/android/app/build/outputs/bundle/release/*.aab > SHA256SUMS-android.txt

      # Append the APK/AAB to the draft release created by the Linux job.
      - name: Upload Android artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
            SHA256SUMS-android.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows bundles (NSIS installer + portable exe)
    runs-on: windows-latest
    # Runs after the Linux and Android jobs so the draft release exists with
    # the full artifact set before it is published (softprops updates the
    # existing release for this tag).
    needs: [verify, release, android]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($conf -ne $tag) {
            Write-Error "Tag 'v$tag' does not match version '$conf' in src-tauri/tauri.conf.json"
            exit 1
          }

      - name: Build Windows installer (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*-setup.exe, target/release/harmonia.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } |
            Set-Content SHA256SUMS-windows.txt

      # Upload the NSIS installer and the raw release binary (a portable
      # executable: it runs standalone when WebView2 is present, which it is
      # on Windows 10/11), then publish the draft release. Name/body are left
      # unset so softprops preserves the ones from the Linux job.
      - name: Upload Windows artifacts & publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/harmonia.exe
            SHA256SUMS-windows.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

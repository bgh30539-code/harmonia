name: Feature request
description: Suggest an idea for Harmonia
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Check the
        [roadmap](https://github.com/bgh30539-code/harmonia/blob/main/docs/ROADMAP.md)
        and search existing issues first — your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the problem or pain point.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature look and behave like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you've considered.
